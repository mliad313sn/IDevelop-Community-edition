# Secret scanning of the FULL git history with gitleaks (a credential committed
# and then deleted is still in the history). Config: .gitleaks.toml.
# NIST SSDF: PS.1 (protect code from unauthorised access/tampering), PW.1.
# The gitleaks CLI is downloaded at a pinned version and verified against a
# pinned SHA-256 (the gitleaks-action needs a licence key for organisations).
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1' # weekly: new rules over old history
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (release checksums file, verified 2026-09-29)
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the (redacted) SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history
          persist-credentials: false
      - name: install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: scan
        run: >-
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose
          --report-format sarif --report-path gitleaks.sarif .
      - name: upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
