# OpenSSF Scorecard: measures this repository against the Scorecard checks
# (Pinned-Dependencies, Token-Permissions, SAST, Branch-Protection, ...).
# Results go to the Security tab as SARIF; publishing to the public Scorecard
# API is OFF (publish_results: false) until the repository is public and the
# maintainers opt in.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 1' # weekly
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF
      # id-token: write is only needed with publish_results: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
