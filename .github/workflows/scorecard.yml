# OpenSSF Scorecard: measures this repository against the Scorecard checks
# (Pinned-Dependencies, Token-Permissions, SAST, Branch-Protection, ...).
# Results go to the Security tab as SARIF; publishing to the public Scorecard
# API is OFF (publish_results: false) until the repository is public and the
# maintainers opt in.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '17 5 * * 1' # weekly
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF
      # id-token: write is only needed with publish_results: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 30
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
          category: scorecard
